<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>

  <!-- Bootstrap 5 CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCqMITaVwZH6ltFsx1CYQzwR8wnG3IFGdc",
    authDomain: "pkth-management.firebaseapp.com",
    projectId: "pkth-management",
    storageBucket: "pkth-management.firebasestorage.app",
    messagingSenderId: "465847001645",
    appId: "1:465847001645:web:56caf6a10c3e10d0054ea4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  // Auto redirect if already logged in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      const redirectPage = localStorage.getItem('redirectAfterLogin') || 'upcoming-trips.html';
      localStorage.removeItem('redirectAfterLogin');
      window.location.href = redirectPage;
    }
  });

  // Login function
  window.googleLogin = function () {
    signInWithPopup(auth, provider)
      .then(() => {
        // will redirect onAuthStateChanged
      })
      .catch((error) => {
        console.error("Login failed:", error.message);
        alert("Login failed: " + error.message);
      });
  };
</script>

  
  <style>
    body {
      background: linear-gradient(to right, #28A745, #218838);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      border: none;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }
    .btn-google {
      background-color: #fff;
      color: #444;
      border: 1px solid #ddd;
    }
    .btn-google:hover {
      background-color: #f7f7f7;
    }
    .logo {
      width: 60px;
    }
  </style>
</head>
<body>

  <div class="container" id="login-container">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4">
          <div class="text-center mb-4">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="logo mb-2" alt="Google Logo">
            <h4>Login with Google</h4>
            <p class="text-muted">Sign in to continue</p>
          </div>
          <button class="btn btn-google w-100" onclick="googleLogin()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" class="me-2" />
            Sign in with Google
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Logout Section -->
  <div class="container" id="logout-container" style="display: none;">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4">
          <div class="text-center mb-4">
            <h4>Welcome</h4>
            <p class="text-muted">You are logged in</p>
          </div>
          <button class="btn btn-danger w-100" onclick="logout()">Logout</button>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
